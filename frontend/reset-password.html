<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Space Mission Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signin.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <nav class="top-nav" aria-label="Main navigation">
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html#mission-list" class="nav-link">Missions</a>
                <a href="live-globe.html" class="nav-link">Live Globe</a>
                <a href="index.html#space-facts" class="nav-link">🌌 Space Facts</a>
                <a href="signin.html" class="nav-link nav-signin">Sign In</a>
            </nav>

            <h1>🔒 Reset Password</h1>
            <p>Choose a new password for your account.</p>
        </div>
    </header>

    <main class="container auth-shell">
        <section class="auth-card" aria-label="Password reset form">
            <div class="auth-badge">New password</div>
            <h2>Set a new password</h2>

            <form id="reset-password-form" novalidate>
                <label class="field-label" for="new-password">New Password</label>
                <input id="new-password" name="password" type="password" placeholder="Enter a new password" autocomplete="new-password">

                <label class="field-label" for="confirm-password">Confirm New Password</label>
                <input id="confirm-password" name="confirm-password" type="password" placeholder="Confirm your new password" autocomplete="new-password">

                <button type="submit" class="auth-submit">Reset Password</button>
            </form>

            <p id="reset-status" class="auth-status">
                Use the secure reset link sent to your email to continue.
            </p>
        </section>
    </main>

    <script src="reset-password.js"></script>
</body>
</html>
