<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Space Mission Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signin.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <nav class="top-nav" aria-label="Main navigation">
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html#mission-list" class="nav-link">Missions</a>
                <a href="live-globe.html" class="nav-link">Live Globe</a>
                <a href="index.html#space-facts" class="nav-link">🌌 Space Facts</a>
                <a href="signin.html" class="nav-link nav-signin">Sign In</a>
            </nav>

            <h1>🔑 Forgot Password</h1>
            <p>Enter the email address associated with your account.</p>
        </div>
    </header>

    <main class="container auth-shell">
        <section class="auth-card" aria-label="Forgot password form">
            <div class="auth-badge">Secure reset</div>
            <h2>Reset your password</h2>

            <form id="forgot-password-form" novalidate>
                <label class="field-label" for="reset-email">Email address</label>
                <input id="reset-email" name="email" type="email" placeholder="you@example.com" autocomplete="email">

                <button type="submit" class="auth-submit">Send Reset Link</button>
            </form>

            <p id="forgot-password-status" class="auth-status">
                If an account exists for that email, a password reset link has been sent.
            </p>
        </section>
    </main>

    <script src="forgot-password.js"></script>
</body>
</html>
