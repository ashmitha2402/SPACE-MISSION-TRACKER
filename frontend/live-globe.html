<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Globe | Space Mission Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="live-globe.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <nav class="top-nav" aria-label="Main navigation">
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html#mission-list" class="nav-link">Missions</a>
                <a href="live-globe.html" class="nav-link active">Live Globe</a>
                <a href="space-agencies.html" class="nav-link nav-space-agencies">🚀 Space Agencies</a>
                <a href="index.html#space-facts" class="nav-link">🌌 Space Facts</a>
                <a href="signin.html" class="nav-link nav-signin">Sign In</a>
            </nav>

            <h1>🌍 Live Globe</h1>
            <p>Monitor the Earth, Moon, and solar mission activity with real source status.</p>
        </div>
    </header>

    <main class="container globe-main">
        <section class="globe-selector-panel">
            <div class="view-toggle" role="tablist" aria-label="Select a celestial body">
                <button type="button" class="view-option active" data-view="earth" role="tab" aria-selected="true">🌍 Earth</button>
                <button type="button" class="view-option" data-view="moon" role="tab" aria-selected="false">🌙 Moon</button>
                <button type="button" class="view-option" data-view="mars" role="tab" aria-selected="false">🔴 Mars</button>
            </div>

            <div class="view-toggle earth-filters" aria-label="Earth agency region filters">
                <button type="button" class="filter-button active" data-region="all">All</button>
                <button type="button" class="filter-button" data-region="North & South America">North & South America</button>
                <button type="button" class="filter-button" data-region="Asia">Asia</button>
                <button type="button" class="filter-button" data-region="Europe">Europe</button>
                <button type="button" class="filter-button" data-region="Africa">Africa</button>
                <button type="button" class="filter-button" data-region="Oceania / Pacific">Oceania / Pacific</button>
            </div>

            <div class="agency-search-wrap">
                <input id="agency-search" type="text" class="agency-search" placeholder="Search agencies, countries, regions..." aria-label="Search space agencies" />
            </div>
        </section>

        <section class="globe-layout">
            <div class="globe-stage-card">
                <div id="globe-canvas" aria-label="Interactive live globe"></div>
                <div id="agency-detail-card" class="agency-detail-card hidden" aria-live="polite"></div>
                <div class="globe-overlay">
                    <span id="globe-live-badge" class="live-badge hidden">LIVE</span>
                    <span id="globe-status-message" class="globe-status-message">Checking tracking data...</span>
                </div>
            </div>

            <aside class="globe-side-panel">
                <div class="globe-card">
                    <h2>Tracking Status</h2>
                    <p id="live-status">Checking live data sources...</p>
                    <p id="last-updated" class="muted">Awaiting timestamp...</p>
                </div>

                <div class="globe-card">
                    <h2>Tracked Objects</h2>
                    <ul id="tracked-objects-list" class="tracked-list"></ul>
                </div>

                <div class="globe-card">
                    <h2>Mission References</h2>
                    <ul id="mission-reference-list" class="tracked-list"></ul>
                </div>
            </aside>
        </section>
    </main>

    <script type="module" src="live-globe.js"></script>
</body>
</html>
